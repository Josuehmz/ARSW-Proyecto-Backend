# Gatling Configuration
gatling {
  core {
    outputDirectoryBaseName = "balatro-load-test"
    runDescription = "Load test for Balatro Backend"
    encoding = "utf-8"
    simulationClass = ""
  }
  
  charting {
    indicators {
      lowerBound = 800
      higherBound = 1200
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }
  
  http {
    warmUpUrl = "http://balatro-alb-1252182129.us-east-1.elb.amazonaws.com/actuator/health"
    enableGA = false
  }
  
  data {
    writers = [console, file]
  }
}
