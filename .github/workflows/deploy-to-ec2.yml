name: Build → Push to ECR → Deploy to EC2

on:
  push:
    branches:
      - despliegue

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 654654254246
  ECR_REPOSITORY: balatro

jobs:
  build-and-push:
    name: Build and Push image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2 (parallel)
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build matrix from secrets using fromJson to avoid evaluation errors
        host: ${{ fromJson('['"'"' + secrets.EC2_HOST_1 + '"'"','"'"' + secrets.EC2_HOST_2 + '"'"']') }}
    environment: staging
    steps:
      - name: Show target
        run: echo "Deploying to ${{ matrix.host }}"

      - name: Copy docker-compose to host
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_SSH_USER }}/backend/docker-compose.yml"

      - name: Deploy via SSH to host
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/${{ secrets.EC2_SSH_USER }}/backend
            cd /home/${{ secrets.EC2_SSH_USER }}/backend || exit 1

            # Authenticate to ECR on the instance (requires AWS CLI configured on the instance
            # or Instance Profile with ECR permissions). If the instance has IAM role, no static creds needed.
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com || true

            # Pull latest image (if available)
            docker-compose pull || true

            # Restart containers
            docker-compose up -d --remove-orphans

            # Show status
            docker ps -a
