name: Build → Push to ECR → Deploy to EC2

on:
  push:
    branches:
      - despliegue

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 654654254246
  ECR_REPOSITORY: balatro

jobs:
  build-and-push:
    name: Build and Push image to ECR
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Verify JAR exists
        run: ls -la target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest .
          
      - name: Push Docker image to ECR
        run: |
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 Host 1
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_1 }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/${{ secrets.EC2_SSH_USER }}/backend
            cd /home/${{ secrets.EC2_SSH_USER }}/backend
            
            # Create or update docker-compose.yml
            cat > docker-compose.yml <<'EOFCOMPOSE'
            version: "3.8"
            services:
              backend:
                image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
                container_name: backend
                ports:
                  - "8080:8080"
                restart: always
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - JAVA_OPTS=-Xms256m -Xmx512m
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 30s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOFCOMPOSE
            
            # Authenticate to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com || true
            
            # Pull and restart
            docker-compose pull || true
            docker-compose up -d --remove-orphans
            docker ps -a

      - name: Deploy to EC2 Host 2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_2 }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /home/${{ secrets.EC2_SSH_USER }}/backend
            cd /home/${{ secrets.EC2_SSH_USER }}/backend
            
            # Create or update docker-compose.yml
            cat > docker-compose.yml <<'EOFCOMPOSE'
            version: "3.8"
            services:
              backend:
                image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
                container_name: backend
                ports:
                  - "8080:8080"
                restart: always
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - JAVA_OPTS=-Xms256m -Xmx512m
                healthcheck:
                  test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 30s
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"
            EOFCOMPOSE
            
            # Authenticate to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com || true
            
            # Pull and restart
            docker-compose pull || true
            docker-compose up -d --remove-orphans
            docker ps -a
